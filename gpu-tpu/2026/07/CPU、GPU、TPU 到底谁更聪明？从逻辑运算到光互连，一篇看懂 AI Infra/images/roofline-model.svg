<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Roofline 模型：以 H100 为例</title>
  <desc id="desc">Roofline 模型示意图，横轴为算术强度，纵轴为可达性能，标出带宽受限区、算力受限区、平衡点，以及逐元素加法、batch=1 解码和大矩阵乘三个典型工作点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF6F4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#3C647A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0B1F33" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 42px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
      .subtitle { font: 400 21px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #48657A; }
      .h2 { font: 700 23px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
      .body { font: 400 18px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #36566A; }
      .small { font: 400 16px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #567185; }
      .axis { font: 700 19px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #36566A; }
      .tick { font: 400 17px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #567185; }
      .lblBlue { font: 700 19px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #315A9D; }
      .lblOrange { font: 700 19px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #A64B15; }
      .note { font: 700 20px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #A64B15; }
      .banner { font: 700 21px "Noto Sans CJK SC", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="80" y="78" class="title">Roofline：一道除法，看出内核卡在哪</text>
  <text x="80" y="118" class="subtitle">以 H100 SXM 为例：BF16 稠密算力约 990 TFLOPS，HBM3 带宽 3.35 TB/s，两者相除得到平衡点 ≈ 295 FLOPs/Byte</text>

  <!-- Plot card -->
  <g filter="url(#shadow)">
    <rect x="70" y="160" width="1460" height="700" rx="24" fill="#FFFFFF"/>
  </g>

  <!-- Region tints -->
  <rect x="200" y="240" width="942" height="540" fill="#315A9D" opacity="0.045"/>
  <rect x="1142" y="240" width="238" height="540" fill="#C0651C" opacity="0.06"/>

  <!-- Grid lines -->
  <g stroke="#D5E2EA" stroke-width="1.5" stroke-dasharray="3 6">
    <line x1="200" y1="650" x2="1380" y2="650"/>
    <line x1="200" y1="520" x2="1380" y2="520"/>
    <line x1="200" y1="390" x2="1380" y2="390"/>
    <line x1="200" y1="261" x2="1140" y2="261"/>
    <line x1="323" y1="240" x2="323" y2="780"/>
    <line x1="559" y1="240" x2="559" y2="780"/>
    <line x1="795" y1="240" x2="795" y2="780"/>
    <line x1="1031" y1="240" x2="1031" y2="780"/>
    <line x1="1267" y1="240" x2="1267" y2="780"/>
  </g>

  <!-- Axes -->
  <line x1="200" y1="240" x2="200" y2="780" stroke="#3C647A" stroke-width="2.5"/>
  <line x1="200" y1="780" x2="1380" y2="780" stroke="#3C647A" stroke-width="2.5"/>

  <!-- Tick labels -->
  <text x="190" y="786" text-anchor="end" class="tick">0.1</text>
  <text x="190" y="656" text-anchor="end" class="tick">1</text>
  <text x="190" y="526" text-anchor="end" class="tick">10</text>
  <text x="190" y="396" text-anchor="end" class="tick">100</text>
  <text x="190" y="267" text-anchor="end" class="tick">1000</text>
  <text x="323" y="808" text-anchor="middle" class="tick">0.1</text>
  <text x="559" y="808" text-anchor="middle" class="tick">1</text>
  <text x="795" y="808" text-anchor="middle" class="tick">10</text>
  <text x="1031" y="808" text-anchor="middle" class="tick">100</text>
  <text x="1267" y="808" text-anchor="middle" class="tick">1000</text>

  <!-- Axis titles -->
  <text x="790" y="842" text-anchor="middle" class="axis">算术强度（FLOPs / Byte，对数轴）</text>
  <text x="122" y="510" text-anchor="middle" class="axis" transform="rotate(-90 122 510)">可达性能（TFLOPS，对数轴）</text>

  <!-- Roofline: sloped bandwidth roof + flat compute roof -->
  <line x1="200" y1="780" x2="1142" y2="261" stroke="#315A9D" stroke-width="5" stroke-linecap="round"/>
  <line x1="1142" y1="261" x2="1380" y2="261" stroke="#C0651C" stroke-width="5" stroke-linecap="round"/>

  <!-- Peak label -->
  <text x="212" y="250" class="small">BF16 稠密峰值 990 TFLOPS</text>

  <!-- Slope label (rotated along the line) -->
  <text x="640" y="512" text-anchor="middle" class="lblBlue" transform="rotate(-29 640 512)">斜率 = HBM 带宽 3.35 TB/s</text>

  <!-- Ridge point -->
  <line x1="1142" y1="261" x2="1142" y2="780" stroke="#A64B15" stroke-width="2.5" stroke-dasharray="7 7"/>
  <circle cx="1142" cy="261" r="10" fill="#FFFFFF" stroke="#A64B15" stroke-width="4"/>
  <text x="1128" y="222" text-anchor="end" class="note">平衡点 ≈ 295 FLOPs/Byte</text>

  <!-- Region labels -->
  <text x="560" y="330" text-anchor="middle" class="h2">带宽受限区</text>
  <text x="560" y="360" text-anchor="middle" class="body">优化 = 少搬数据：分块复用、融合、低精度</text>
  <text x="1261" y="420" text-anchor="middle" class="h2">算力受限区</text>
  <text x="1261" y="450" text-anchor="middle" class="body">优化 = 喂饱矩阵单元</text>

  <!-- Workload points -->
  <circle cx="300" cy="724" r="9" fill="#315A9D" stroke="#FFFFFF" stroke-width="3"/>
  <text x="318" y="712" class="lblBlue">逐元素加法：AI ≈ 0.08</text>
  <text x="318" y="738" class="small">天生贴在带宽墙上</text>

  <circle cx="559" cy="582" r="9" fill="#315A9D" stroke="#FFFFFF" stroke-width="3"/>
  <text x="577" y="570" class="lblBlue">batch=1 的 LLM 解码：AI ≈ 1</text>
  <text x="577" y="596" class="small">被权重读取带宽卡死，与峰值算力无关</text>

  <circle cx="1250" cy="261" r="9" fill="#C0651C" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1250" y="300" text-anchor="middle" class="lblOrange">分块良好的大矩阵乘</text>
  <text x="1250" y="326" text-anchor="middle" class="small">唯一能贴近峰值的一类负载</text>

  <!-- Bottom banner -->
  <g filter="url(#shadow)">
    <rect x="70" y="884" width="1460" height="70" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="800" y="928" text-anchor="middle" class="banner">读法：先算内核的算术强度；落在斜线上就别盯着 FLOPS，去优化搬运；过了平衡点，才轮到拼算力</text>
</svg>
