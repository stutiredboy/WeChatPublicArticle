<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AI Infra 的数据路径与互连层级</title>
  <desc id="desc">展示数据从存储、网络和 CPU 主存进入加速器 HBM、片上 SRAM 与矩阵单元的路径，以及 scale-up 和 scale-out 互连。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF6F4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#3C647A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0B1F33" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
      .subtitle { font: 400 21px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #48657A; }
      .h1 { font: 700 26px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .h2 { font: 700 23px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
      .body { font: 400 18px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #36566A; }
      .small { font: 400 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #567185; }
      .tag { font: 700 17px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .note { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #A64B15; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="80" y="78" class="title">AI Infra 的主角常常不是“算”，而是“搬”</text>
  <text x="80" y="118" class="subtitle">一次训练或推理，要跨过存储、网络、主存、HBM、片上 SRAM 和寄存器；越靠近计算单元，越快、越小、越贵</text>

  <!-- Data source -->
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="250" height="225" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="70" y="205" width="250" height="62" rx="24" fill="#526E80"/>
  <rect x="70" y="243" width="250" height="24" fill="#526E80"/>
  <text x="195" y="246" text-anchor="middle" class="h1">数据源</text>
  <rect x="100" y="294" width="190" height="48" rx="10" fill="#E8EFF3"/>
  <text x="195" y="325" text-anchor="middle" class="h2">对象存储 / NVMe</text>
  <rect x="100" y="360" width="190" height="48" rx="10" fill="#E8EFF3"/>
  <text x="195" y="391" text-anchor="middle" class="h2">数据集 / Checkpoint</text>

  <!-- Host -->
  <g filter="url(#shadow)">
    <rect x="405" y="170" width="300" height="295" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="405" y="170" width="300" height="62" rx="24" fill="#315A9D"/>
  <rect x="405" y="208" width="300" height="24" fill="#315A9D"/>
  <text x="555" y="211" text-anchor="middle" class="h1">CPU Host</text>
  <rect x="438" y="260" width="234" height="55" rx="11" fill="#EEF3FB"/>
  <text x="555" y="295" text-anchor="middle" class="h2">数据预处理与调度</text>
  <rect x="438" y="333" width="234" height="55" rx="11" fill="#EEF3FB"/>
  <text x="555" y="368" text-anchor="middle" class="h2">主存 DRAM</text>
  <text x="555" y="425" text-anchor="middle" class="body">OS · 网络 · 存储 · Kernel Launch</text>

  <!-- Accelerator -->
  <g filter="url(#shadow)">
    <rect x="805" y="145" width="720" height="370" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="805" y="145" width="720" height="66" rx="28" fill="#167A72"/>
  <rect x="805" y="185" width="720" height="26" fill="#167A72"/>
  <text x="1165" y="188" text-anchor="middle" class="h1">GPU / TPU 加速器</text>

  <rect x="845" y="250" width="180" height="190" rx="18" fill="#E7F4F2" stroke="#8AC8C2" stroke-width="2"/>
  <text x="935" y="288" text-anchor="middle" class="h2">HBM</text>
  <text x="935" y="325" text-anchor="middle" class="body">容量较大</text>
  <text x="935" y="356" text-anchor="middle" class="body">片外高带宽</text>
  <text x="935" y="405" text-anchor="middle" class="small">权重 · 激活 · KV Cache</text>

  <rect x="1080" y="250" width="180" height="190" rx="18" fill="#D5EEEA" stroke="#64B7AE" stroke-width="2"/>
  <text x="1170" y="288" text-anchor="middle" class="h2">片上 SRAM</text>
  <text x="1170" y="325" text-anchor="middle" class="body">SMEM / VMEM</text>
  <text x="1170" y="356" text-anchor="middle" class="body">小而更快</text>
  <text x="1170" y="405" text-anchor="middle" class="small">Tile 暂存与复用</text>

  <rect x="1315" y="250" width="170" height="190" rx="18" fill="#BCE2DD" stroke="#39988E" stroke-width="2"/>
  <text x="1400" y="288" text-anchor="middle" class="h2">寄存器</text>
  <text x="1400" y="325" text-anchor="middle" class="body">最小、最快</text>
  <rect x="1342" y="356" width="116" height="58" rx="12" fill="#167A72"/>
  <text x="1400" y="392" text-anchor="middle" class="tag">ALU / MXU</text>

  <g fill="none" stroke="#3C647A" stroke-width="4" marker-end="url(#arrow)">
    <path d="M320 317H400"/>
    <path d="M705 317H795"/>
    <path d="M1027 345H1070"/>
    <path d="M1262 345H1305"/>
  </g>
  <text x="360" y="296" text-anchor="middle" class="small">网络 / DMA</text>
  <text x="750" y="296" text-anchor="middle" class="small">PCIe / C2C</text>

  <!-- memory wall -->
  <rect x="805" y="540" width="720" height="82" rx="18" fill="#FFF4E8" stroke="#F0B982" stroke-width="2"/>
  <text x="1165" y="576" text-anchor="middle" class="note">内存墙：峰值算力增长得比数据供给更快</text>
  <text x="1165" y="607" text-anchor="middle" class="body">优化的核心是分块、复用、融合、低精度，以及让通信与计算重叠</text>

  <!-- Scale levels -->
  <text x="70" y="686" class="h2">从一颗芯片扩展到集群，互连也分层：</text>
  <g filter="url(#shadow)">
    <rect x="70" y="720" width="420" height="160" rx="22" fill="#FFFFFF"/>
    <rect x="590" y="720" width="420" height="160" rx="22" fill="#FFFFFF"/>
    <rect x="1110" y="720" width="415" height="160" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="70" y="720" width="420" height="54" rx="22" fill="#315A9D"/>
  <rect x="70" y="750" width="420" height="24" fill="#315A9D"/>
  <text x="280" y="756" text-anchor="middle" class="h1">芯片内</text>
  <text x="100" y="814" class="body">缓存 / SRAM / NoC / HBM</text>
  <text x="100" y="848" class="small">目标：别让矩阵单元“饿着”</text>

  <rect x="590" y="720" width="420" height="54" rx="22" fill="#167A72"/>
  <rect x="590" y="750" width="420" height="24" fill="#167A72"/>
  <text x="800" y="756" text-anchor="middle" class="h1">Scale-up：紧耦合扩展</text>
  <text x="620" y="814" class="body">NVLink / NVSwitch / TPU ICI + OCS</text>
  <text x="620" y="848" class="small">目标：多加速器像一台更大的机器</text>

  <rect x="1110" y="720" width="415" height="54" rx="22" fill="#D66B1F"/>
  <rect x="1110" y="750" width="415" height="24" fill="#D66B1F"/>
  <text x="1318" y="756" text-anchor="middle" class="h1">Scale-out：集群扩展</text>
  <text x="1140" y="814" class="body">InfiniBand / Ethernet / DCN</text>
  <text x="1140" y="848" class="small">目标：跨节点同步、容错与调度</text>

  <text x="800" y="936" text-anchor="middle" class="subtitle">所以 AI 性能不是“芯片 FLOPS”一个数，而是计算、内存、互连、软件和可靠性的乘积</text>
</svg>
