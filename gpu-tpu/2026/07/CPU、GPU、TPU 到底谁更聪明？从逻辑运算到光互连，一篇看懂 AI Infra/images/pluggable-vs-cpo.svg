<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">可插拔光模块与共封装光学 CPO 对比</title>
  <desc id="desc">展示传统可插拔光模块和共封装光学的电信号路径、光引擎、外置激光器与光纤位置变化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFCFF"/>
      <stop offset="1" stop-color="#F2F7F4"/>
    </linearGradient>
    <marker id="arrowElec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#D66B1F"/>
    </marker>
    <marker id="arrowOpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#167A72"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0B1F33" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
      .subtitle { font: 400 21px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #48657A; }
      .h1 { font: 700 28px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .h2 { font: 700 23px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
      .body { font: 400 18px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #36566A; }
      .small { font: 400 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #567185; }
      .tag { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .claim { font: 700 23px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0B1F33; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <text x="80" y="76" class="title">CPO 不是“只剩光纤”，而是把光电转换搬到 ASIC 身边</text>
  <text x="80" y="116" class="subtitle">假设“一体封装”指 Co-Packaged Optics：改变的是形态与位置，不是把激光、调制、探测和控制功能变没</text>

  <!-- Traditional pluggable -->
  <g filter="url(#shadow)">
    <rect x="70" y="160" width="1460" height="320" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="70" y="160" width="1460" height="66" rx="28" fill="#526E80"/>
  <rect x="70" y="200" width="1460" height="26" fill="#526E80"/>
  <text x="105" y="203" class="h1">传统可插拔光模块：光电转换在面板模块内</text>

  <rect x="115" y="270" width="220" height="120" rx="18" fill="#315A9D"/>
  <text x="225" y="320" text-anchor="middle" class="h1">交换 / XPU ASIC</text>
  <text x="225" y="355" text-anchor="middle" class="tag">高速 SerDes</text>

  <line x1="340" y1="330" x2="555" y2="330" stroke="#D66B1F" stroke-width="9" marker-end="url(#arrowElec)"/>
  <text x="447" y="305" text-anchor="middle" class="body">较长的板级电通道</text>
  <text x="447" y="365" text-anchor="middle" class="small">速率越高，损耗与均衡功耗越难压</text>

  <rect x="570" y="252" width="620" height="166" rx="20" fill="#FFF4EA" stroke="#E9B58E" stroke-width="2"/>
  <text x="600" y="286" class="h2">面板可插拔光模块</text>
  <g>
    <rect x="600" y="314" width="92" height="65" rx="10" fill="#D66B1F"/><text x="646" y="352" text-anchor="middle" class="tag">DSP*</text>
    <rect x="704" y="314" width="104" height="65" rx="10" fill="#E78B45"/><text x="756" y="341" text-anchor="middle" class="tag">Driver</text><text x="756" y="360" text-anchor="middle" class="tag">/ TIA</text>
    <rect x="820" y="314" width="104" height="65" rx="10" fill="#E78B45"/><text x="872" y="352" text-anchor="middle" class="tag">激光器</text>
    <rect x="936" y="314" width="104" height="65" rx="10" fill="#E78B45"/><text x="988" y="341" text-anchor="middle" class="tag">调制器</text><text x="988" y="360" text-anchor="middle" class="tag">/ 探测器</text>
    <rect x="1052" y="314" width="108" height="65" rx="10" fill="#E78B45"/><text x="1106" y="341" text-anchor="middle" class="tag">控制</text><text x="1106" y="360" text-anchor="middle" class="tag">/ 监控</text>
  </g>
  <text x="600" y="401" class="small">* 架构不同：DSP 可在模块内，也可能由 LPO/LRO 等路线调整</text>

  <line x1="1200" y1="330" x2="1438" y2="330" stroke="#167A72" stroke-width="9" marker-end="url(#arrowOpt)"/>
  <text x="1320" y="305" text-anchor="middle" class="body">光信号</text>
  <text x="1320" y="368" text-anchor="middle" class="small">前面板 → 光纤</text>

  <!-- CPO -->
  <g filter="url(#shadow)">
    <rect x="70" y="520" width="1460" height="340" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="70" y="520" width="1460" height="66" rx="28" fill="#167A72"/>
  <rect x="70" y="560" width="1460" height="26" fill="#167A72"/>
  <text x="105" y="563" class="h1">CPO：光引擎与主 ASIC 共封装，尽快把电信号变成光</text>

  <rect x="110" y="630" width="720" height="170" rx="24" fill="#E8F6F4" stroke="#64B7AE" stroke-width="3"/>
  <text x="140" y="664" class="h2">同一封装基板 / 紧邻封装</text>
  <rect x="145" y="692" width="235" height="78" rx="14" fill="#315A9D"/>
  <text x="262" y="728" text-anchor="middle" class="h1">交换 / XPU ASIC</text>
  <text x="262" y="753" text-anchor="middle" class="tag">高速 SerDes</text>
  <line x1="385" y1="731" x2="445" y2="731" stroke="#D66B1F" stroke-width="8" marker-end="url(#arrowElec)"/>
  <text x="415" y="705" text-anchor="middle" class="small">短电通道</text>
  <rect x="460" y="679" width="330" height="103" rx="15" fill="#D66B1F"/>
  <text x="625" y="716" text-anchor="middle" class="h1">共封装光引擎</text>
  <text x="625" y="749" text-anchor="middle" class="tag">Driver/TIA · 调制 · 探测 · 监控</text>

  <line x1="835" y1="714" x2="1060" y2="714" stroke="#167A72" stroke-width="9" marker-end="url(#arrowOpt)"/>
  <text x="946" y="686" text-anchor="middle" class="body">光纤阵列 / 连接器</text>

  <rect x="1075" y="643" width="200" height="142" rx="18" fill="#E7F4F2" stroke="#64B7AE" stroke-width="2"/>
  <text x="1175" y="684" text-anchor="middle" class="h2">光纤链路</text>
  <text x="1175" y="724" text-anchor="middle" class="body">机内 / 机架间</text>
  <text x="1175" y="756" text-anchor="middle" class="body">数据中心网络</text>

  <rect x="1320" y="630" width="175" height="170" rx="18" fill="#FFF4EA" stroke="#E9B58E" stroke-width="2"/>
  <text x="1408" y="670" text-anchor="middle" class="h2">外置激光源</text>
  <text x="1408" y="704" text-anchor="middle" class="body">可做成可插拔</text>
  <text x="1408" y="736" text-anchor="middle" class="body">便于散热与维护</text>
  <line x1="1320" y1="765" x2="1278" y2="765" stroke="#167A72" stroke-width="6" marker-end="url(#arrowOpt)"/>

  <!-- Conclusion -->
  <rect x="70" y="900" width="1460" height="94" rx="20" fill="#FFFFFF" stroke="#C9D9D6" stroke-width="2"/>
  <text x="105" y="938" class="claim">被重构的是“盒子边界”：</text>
  <text x="350" y="938" class="body">完整可插拔收发模块 → 共封装光引擎 + 可维护激光源 + 光连接</text>
  <text x="105" y="972" class="claim">不会消失的是“光学功能”：</text>
  <text x="390" y="972" class="body">发光、调制、探测、驱动、监控、封装、测试与连接，一项都不能只靠光纤完成</text>
</svg>
