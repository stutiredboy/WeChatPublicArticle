  - main [ref=e239]:
    - heading "非全日制 MEM 工程管理硕士毕业论文实战指南" [level=1] [ref=e240]
    - blockquote [ref=e241]:
      - paragraph [ref=e242]:
        - text: 本指南面向一个具体的人：你是非全日制 MEM 在读生，白天上班，晚上带着焦虑打开电脑，不知道论文该怎么开始。这份文档的目标是让你
        - strong [ref=e243]: 每一步都知道做什么、怎么做、做到什么程度算合格
        - text: 。
    - separator [ref=e244]
    - heading "第零章 在一切开始之前——给迷茫的你" [level=2] [ref=e245]
    - heading "0.1 你的焦虑是正常的，但可以被结构化" [level=3] [ref=e246]
    - paragraph [ref=e247]: 你现在的状态大概率是这样的：
    - list [ref=e248]:
      - listitem [ref=e249]: 不知道自己能写什么
      - listitem [ref=e250]: 觉得同学们都已经开始了，只有自己还在原地
      - listitem [ref=e251]: 打开知网看了几篇论文，完全看不懂在说什么
      - listitem [ref=e252]: 害怕选了一个太难的题目，更害怕选了一个太水的题目
    - paragraph [ref=e253]:
      - strong [ref=e254]: 这些都是正常的。
      - text: 很多非全日制 MEM 学生在开题前都会经历这个阶段。焦虑的本质不是"你不行"，而是"你不知道全貌"。当你看完这份指南，你会发现整个论文就是一个项目管理题——而你恰好在学项目管理。
    - heading "0.2 MEM 论文到底是什么？一句话讲清楚" [level=3] [ref=e255]
    - paragraph [ref=e256]:
      - strong [ref=e257]: MEM 论文 = 用学过的管理理论和工具，解决你工作中一个真实的工程管理问题，并用数据、调研或评鉴证明你的方案有效。
    - paragraph [ref=e258]:
      - text: 它不是：
      - text: "- 学术发现（不需要你提出新理论）"
      - text: "- 工作总结（不能只有\"我做了什么\"，还要有\"为什么这么做\"和\"效果如何\"）"
      - text: "- 技术报告（重点不是技术本身，而是"
      - strong [ref=e259]: 管理
      - text: 技术实施的过程）
    - heading "0.3 给自己做一次\"资源盘点\"" [level=3] [ref=e260]
    - paragraph [ref=e261]: 在选题之前，先用 30 分钟填写下面这张表。它决定了你后续所有的选择：
    - table [ref=e262]:
      - rowgroup [ref=e263]:
        - row "盘点维度 你的回答" [ref=e264]:
          - columnheader "盘点维度" [ref=e265]
          - columnheader "你的回答" [ref=e266]
      - rowgroup [ref=e267]:
        - row "你目前的行业和岗位？ （如：互联网/基础架构运维）" [ref=e268]:
