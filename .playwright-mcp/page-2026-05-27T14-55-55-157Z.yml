          - cell "15%" [ref=e599]
          - cell "回复是否及时，要求是否清楚，是否愿意指出问题" [ref=e600]
          - cell "1-5" [ref=e601]
    - paragraph [ref=e602]:
      - strong [ref=e603]: 建议：
      - text: 总分低于 3.5 分要谨慎；如果导师名气很大但沟通极少，你需要额外找企业导师、师兄师姐或同门补位。
    - heading "2.5 第一次联系导师的话术模板" [level=3] [ref=e604]
    - paragraph [ref=e605]: 不要发“老师您好，我想请您指导论文，可以吗？”这种空消息。你要让导师一眼看出你做过准备。
    - code [ref=e608]: 老师您好，我是 [年级/专业/姓名]，目前在 [公司/行业/岗位] 工作。 我初步想围绕 [具体工程场景] 中的 [具体管理问题] 做 MEM 论文。 目前有 3 个备选方向： 1. [题目1]：可用数据是 [数据]，可能方法是 [方法] 2. [题目2]：可用数据是 [数据]，可能方法是 [方法] 3. [题目3]：可用数据是 [数据]，可能方法是 [方法] 我比较担心 [最大不确定性]，想请老师帮忙判断哪个方向更适合作为毕业论文。 如果方便，我想约您 [两个可选时间] 沟通 20 分钟。我会提前把一页纸选题卡发给您。 谢谢老师。
    - paragraph [ref=e609]: 导师看重的不是你已经多厉害，而是你是否主动、具体、可推进。
    - separator [ref=e610]
    - heading "第三章 选题——从\"我不知道写什么\"到\"就写这个\"" [level=2] [ref=e612]
    - heading "3.1 选题自检流程（决策树）" [level=3] [ref=e613]
    - paragraph [ref=e614]: 按顺序回答以下问题：
    - code [ref=e617]: "Q1: 你目前工作中最头疼的管理问题是什么？ ├─ 能说出具体问题 → 进入 Q2 └─ 说不出来 → 执行\"痛点挖掘练习\"（见 3.2） Q2: 这个问题属于\"工程管理\"范畴吗？（进度/成本/质量/风险/供应链/组织协同） ├─ 是 → 进入 Q3 └─ 不确定 → 见 3.3 \"MEM 选题边界判断\" Q3: 你能拿到支撑这个问题的数据吗？（企业内部数据 / 可发问卷 / 公开行业数据） ├─ 能 → 进入 Q4 └─ 不能 → 换一个痛点，回到 Q1 Q4: 用一句话描述你的研究：\"针对 [企业/项目] 的 [具体问题]，运用 [理论/方法]， 提出 [优化方案]，并通过 [验证方式] 证明方案有效。\" ├─ 能写出来 → 恭喜，你有选题了！ └─ 写不出来 → 见 3.4 \"题目公式化生成\""
    - heading "3.2 痛点挖掘练习（如果你真的\"想不出来\"）" [level=3] [ref=e618]
    - paragraph [ref=e619]: 用一周时间，每天下班后花 10 分钟记录：
