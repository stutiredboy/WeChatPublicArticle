          - cell "公司内部群/邮件" [ref=e1523]
          - cell "60-80%" [ref=e1524]
          - cell "研究自己企业时" [ref=e1525]
        - row "行业微信群/朋友圈 20-30% 研究某个行业时" [ref=e1526]:
          - cell "行业微信群/朋友圈" [ref=e1527]
          - cell "20-30%" [ref=e1528]
          - cell "研究某个行业时" [ref=e1529]
        - row "问卷星\"样本服务\" 按量付费 预算充足时的兜底方案" [ref=e1530]:
