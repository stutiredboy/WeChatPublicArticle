    - paragraph [ref=e2223]:
      - strong [ref=e2224]: 再确认一件事：
      - text: 有些学校会要求提交 AI 使用声明，甚至限制生成式 AI 在论文写作中的使用范围。开写前先查学校最新规定；如果用了 AI 辅助翻译、润色或制图，保留原始材料、修改记录和人工核验过程。
    - paragraph [ref=e2225]:
      - strong [ref=e2226]: 盲审专家识别 AI 论文的三个特征：
      - text: 1. 文风过于流畅、缺少个人风格和专业术语的精准使用
      - text: 2. 论述"正确但空洞"，缺乏具体数据和真实案例细节
      - text: 3. 参考文献中混入不存在的论文（AI 编造的）
