    - heading "B. 论文写作检查清单" [level=3] [ref=e2390]
    - paragraph [ref=e2391]:
      - strong [ref=e2392]: 内容完整性：
      - text: "- [ ] 题目包含：具体企业/项目 + 管理问题 + 理论方法"
      - text: "- [ ] 中文摘要 500-800 字，包含背景、方法、结果、意义"
      - text: "- [ ] 关键词 3-5 个"
      - text: "- [ ] 英文摘要经过人工校对（不是纯机翻；建议请英语好的同学或用专业润色工具校对，AI 直译往往术语不准）"
      - text: "- [ ] 每章有\"本章小结\""
      - text: "- [ ] 所有图表有编号、有标题、有来源说明"
      - text: "- [ ] 所有数据有出处，引用有角标"
      - text: "- [ ] 参考文献 ≥ 40 篇，近 5 年 ≥ 50%"
      - text: "- [ ] 参考文献格式统一（GB/T 7714）"
      - text: "- [ ] 查重率满足学校要求，并预留安全余量"
      - text: "- [ ] 全文无错别字（至少通读 3 遍）"
      - text: "- [ ] 页眉页脚、页码、目录、字体字号均符合学校模板"
    - paragraph [ref=e2393]:
      - strong [ref=e2394]: 容易遗漏的页面/附件：
      - text: "- [ ] 独创性声明和学位论文版权使用授权书（学校模板中通常有，需要手写签名）"
      - text: "- [ ] 致谢（简短真诚即可，不要写成获奖感言，感谢导师、企业配合、家人支持）"
