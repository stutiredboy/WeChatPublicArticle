    - heading "8.2 \"理论选择\"的核心原则" [level=3] [ref=e1744]
    - list [ref=e1745]:
      - listitem [ref=e1746]:
        - strong [ref=e1747]: 先选问题，再选理论
        - text: ：不是"我想用 AHP"，而是"我需要评价供应商，AHP 适合做这件事"
      - listitem [ref=e1748]:
        - strong [ref=e1749]: 不超过 2-3 个核心理论
        - text: ：贪多嚼不烂，每个理论都要在正文中实际用到
      - listitem [ref=e1750]:
        - strong [ref=e1751]: 用成熟理论，不追新
        - text: ：MEM 论文的创新不是"发明新理论"，而是"把成熟理论用在新场景"
      - listitem [ref=e1752]:
        - strong [ref=e1753]: 理论和方法要形成闭环
        - text: ：理论用来分析问题 → 方法用来建模/计算 → 数据用来验证
