    - heading "7.2 问卷设计的\"傻瓜式\"流程" [level=3] [ref=e1491]
    - paragraph [ref=e1492]:
      - strong [ref=e1493]: "Step 1: 确定问卷的目标"
    - paragraph [ref=e1494]:
      - text: 你的问卷要回答什么问题？只有两种：
      - text: "-"
      - strong [ref=e1495]: 识别型
      - text: ："影响 XX 的关键因素有哪些？各因素影响程度如何？"
      - text: "-"
      - strong [ref=e1496]: 评价型
      - text: ："XX 的现状水平如何？各维度得分如何？"
    - paragraph [ref=e1497]:
      - strong [ref=e1498]: "Step 2: 确定量表结构"
    - paragraph [ref=e1499]:
      - text: 使用
      - strong [ref=e1500]: 李克特 5 级量表
      - text: （1=非常不同意，2=不同意，3=一般，4=同意，5=非常同意）。
    - paragraph [ref=e1501]: 问卷结构模板：
    - code [ref=e1504]: "Part 1: 基本信息（5-8 题） - 年龄、性别、学历、工作年限、所属部门、职位层级等 Part 2: 第一个维度（4-6 题） 例：进度管理因素 Q1: 项目进度计划制定合理且可执行 [1] [2] [3] [4] [5] Q2: 进度偏差能够被及时发现和纠正 [1] [2] [3] [4] [5] ... Part 3: 第二个维度（4-6 题） Part 4: 第三个维度（4-6 题） Part 5: 第四个维度（4-6 题）"
    - paragraph [ref=e1505]:
      - strong [ref=e1506]: "Step 3: 量表从哪来？"
    - paragraph [ref=e1507]:
      - strong [ref=e1508]: 不要完全凭空编问卷题目！
      - text: 正确做法：
      - text: 1. 在知网搜索你的研究方向的硕博论文
      - text: 2. 翻到论文附录，找到他们的问卷
      - text: 3. 选取和你最相关的题目，根据你的研究情境做适当修改
      - text: 4. 在论文中注明"本问卷参考了 XX(2023) 的量表，并根据 XX 行业特点进行了调整"
    - paragraph [ref=e1509]: 这样更合规，也更容易提高问卷的信效度。
    - paragraph [ref=e1510]:
      - strong [ref=e1511]: "Step 4: 预测试"
    - paragraph [ref=e1512]:
      - text: 正式发放前，先找 20-30 人做预测试：
      - text: "- 填写时间是否在 5 分钟内？"
      - text: "- 有没有歧义的题目？"
      - text: "- 数据做一次信度检验，Cronbach's α < 0.7 的维度需要修改"
    - paragraph [ref=e1513]:
      - strong [ref=e1514]: "Step 5: 正式发放与回收"
    - table [ref=e1515]:
      - rowgroup [ref=e1516]:
        - row "发放渠道 预期回收率 适用场景" [ref=e1517]:
          - columnheader "发放渠道" [ref=e1518]
