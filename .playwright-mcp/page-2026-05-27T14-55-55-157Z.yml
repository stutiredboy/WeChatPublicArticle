    - heading "2.2 和导师第一次见面前的准备清单" [level=3] [ref=e550]
    - paragraph [ref=e551]:
      - strong [ref=e552]: 绝对不要空手去。
      - text: 带着以下材料：
    - list [ref=e553]:
      - listitem [ref=e554]:
        - strong [ref=e555]: 你的资源盘点表
        - text: （第零章那张）
      - listitem [ref=e556]:
        - strong [ref=e557]: 3 个备选选题方向
        - text: ，每个用一句话描述：
        - text: "- \"我在 XX 公司负责 XX，发现 XX 问题，想用 XX 方法来研究\""
      - listitem [ref=e558]:
        - strong [ref=e559]: 你能获取的数据清单
        - text: ：
        - text: "- \"我能拿到过去 3 年的项目成本报表\""
        - text: "- \"我能在公司内部发放问卷，预计可以回收 150-200 份\""
      - listitem [ref=e560]:
        - strong [ref=e561]: 你的时间安排
        - text: ：告诉导师你每周能投入多少时间、计划什么时候提交
    - heading "2.3 如何判断一个导师\"靠不靠谱\"" [level=3] [ref=e562]
    - paragraph [ref=e563]:
      - text: 在确定导师前，做这三件事：
      - text: "1."
      - strong [ref=e564]: 找该导师往届学生问
      - text: ：导师多久回一次消息？会不会帮你逐章修改？盲审通过率如何？
      - text: "2."
      - strong [ref=e565]: 看导师的研究方向
      - text: ：在知网搜导师名字，看他近 3 年发了什么论文，和你想做的方向有没有交集
      - text: "3."
      - strong [ref=e566]: 第一次沟通后评估
      - text: ：导师是否在 3 天内回复了你？是否给了明确的方向建议？
    - heading "2.4 导师选择评分表" [level=3] [ref=e567]
    - paragraph [ref=e568]: 如果你能选择导师，用下面这张表打分。不要只看名气，要看“能不能把你带过论文全过程”。
    - table [ref=e569]:
      - rowgroup [ref=e570]:
        - row "维度 权重 评分标准 你的评分" [ref=e571]:
          - columnheader "维度" [ref=e572]
          - columnheader "权重" [ref=e573]
          - columnheader "评分标准" [ref=e574]
          - columnheader "你的评分" [ref=e575]
      - rowgroup [ref=e576]:
        - row "研究方向匹配 25% 导师近年论文、课题、学生论文是否与你的方向接近 1-5" [ref=e577]:
          - cell "研究方向匹配" [ref=e578]
          - cell "25%" [ref=e579]
          - cell "导师近年论文、课题、学生论文是否与你的方向接近" [ref=e580]
          - cell "1-5" [ref=e581]
        - row "指导频率 25% 是否愿意定期看材料、给明确修改意见 1-5" [ref=e582]:
          - cell "指导频率" [ref=e583]
          - cell "25%" [ref=e584]
          - cell "是否愿意定期看材料、给明确修改意见" [ref=e585]
          - cell "1-5" [ref=e586]
        - row "实践理解 20% 是否理解企业案例、工程管理、非全日制学生处境 1-5" [ref=e587]:
          - cell "实践理解" [ref=e588]
          - cell "20%" [ref=e589]
          - cell "是否理解企业案例、工程管理、非全日制学生处境" [ref=e590]
          - cell "1-5" [ref=e591]
        - row "方法支持 15% 能否指导问卷、案例、模型、数据分析等方法 1-5" [ref=e592]:
          - cell "方法支持" [ref=e593]
          - cell "15%" [ref=e594]
          - cell "能否指导问卷、案例、模型、数据分析等方法" [ref=e595]
          - cell "1-5" [ref=e596]
