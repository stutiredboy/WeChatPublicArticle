    - heading "10.1 盲审专家常见的扫读顺序" [level=3] [ref=e1954]
    - list [ref=e1955]:
      - listitem [ref=e1956]:
        - strong [ref=e1957]: 封面和目录
        - text: → 判断"格式是否认真"
      - listitem [ref=e1958]:
        - strong [ref=e1959]: 摘要
        - text: → 判断"研究有没有价值"
      - listitem [ref=e1960]:
        - strong [ref=e1961]: 第 3-4 章的图表
        - text: → 判断"数据是不是真的"
      - listitem [ref=e1962]:
        - strong [ref=e1963]: 第 5-6 章
        - text: → 判断"方案能不能落地"
      - listitem [ref=e1964]:
        - strong [ref=e1965]: 参考文献
        - text: → 判断"学术态度是否端正"
    - paragraph [ref=e1966]:
      - strong [ref=e1967]: 这意味着：格式和摘要是你的"第一道门槛"。
      - text: 如果这两个地方出问题，后面写得再好也可能被低分。
