      - text: "- [ ] 摘要中提到的方法/结论，正文中都有对应内容"
      - text: "- [ ] 第 3 章提出的每个问题，在第 4-5 章都有成因分析和对应方案"
      - text: "- [ ] 第 6 章验证的指标，和第 3 章的问题描述指标一致"
      - text: "- [ ] 关键词和题目中出现的核心概念，在第 2 章有理论定义"
