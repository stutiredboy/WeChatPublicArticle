    - heading "7.7 访谈提纲模板" [level=3] [ref=e1684]
    - paragraph [ref=e1685]: 访谈适合用来解释“为什么”。建议每类角色访谈 3-5 人，总计 8-12 人即可形成较扎实的定性材料。
    - code [ref=e1688]: 访谈对象：项目经理 / 一线工程师 / 业务方 / 供应商 / 管理者 访谈时长：30-45 分钟 访谈方式：面对面 / 腾讯会议 / 电话 1. 您在该项目/流程中承担什么角色？ 2. 您认为当前 [管理问题] 最突出的表现是什么？能否举一个具体例子？ 3. 这个问题通常在什么环节发生？发生频率大概如何？ 4. 您认为主要原因是什么？制度、人员、工具、外部环境中哪个更关键？ 5. 现有管理流程中哪些地方最影响效率或质量？ 6. 如果要改进，您认为最可行的措施是什么？ 7. 对本文拟提出的 [方案方向]，您认为可行性和阻力分别是什么？ 8. 是否还有您认为重要但前面没问到的问题？
    - paragraph [ref=e1689]: 访谈写入论文时，不要大段贴原话。正确写法是“观点归纳表 + 典型短句 + 你的分析”。
