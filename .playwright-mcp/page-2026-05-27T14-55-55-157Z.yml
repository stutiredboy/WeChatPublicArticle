        - text: ——它直接构成你文献综述最后一段"研究缺口"的内容，也是你论文存在的理由。
    - heading "4.3 文献综述的写作结构（可直接套用的模板）" [level=3] [ref=e931]
    - paragraph [ref=e932]:
      - text: 文献综述不是罗列"张三说了什么、李四说了什么"，而是要按
      - strong [ref=e933]: 主题
      - text: 组织，形成
      - strong [ref=e934]: 有观点的叙述
      - text: ：
    - code [ref=e937]: 2.1 [核心理论] 的研究现状 2.1.1 [理论]的起源与发展（3-5 段，讲清楚这个理论是什么、核心要素有哪些） 2.1.2 [理论]在工程管理中的应用（综述别人怎么用的，按时间线或应用场景分） 2.2 [你的研究主题] 的研究现状 2.2.1 国外研究综述（按主题归类，不是按作者罗列） 2.2.2 国内研究综述（同上） 2.3 文献评述与研究缺口（最关键的一节，500-800字） - 现有研究取得了哪些成果？（肯定前人） - 现有研究存在哪些不足？（指出缺口） - 本研究如何弥补这些不足？（亮出你的价值）
    - paragraph [ref=e938]:
      - strong [ref=e939]: "\"研究缺口\"怎么写——常用句式："
    - list [ref=e940]:
      - listitem [ref=e941]: "\"现有研究多聚焦于大型基建项目，针对 [你的行业] 的 [具体问题] 研究较少\""
      - listitem [ref=e942]: "\"已有成果在方法上以定性分析为主，缺乏 [你要用的定量方法] 的实证研究\""
      - listitem [ref=e943]: "\"当前研究较少将 [理论A] 与 [理论B] 结合应用于 [你的场景]\""
    - heading "4.4 参考文献的常见要求" [level=3] [ref=e944]
    - paragraph [ref=e945]: 不同学校对参考文献数量、近年文献比例和英文文献数量的要求可能不同。下表可作为开题和初稿阶段的保守目标，最终以学校模板和导师要求为准。
