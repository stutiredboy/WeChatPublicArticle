        - row "管理诊断/调研报告类 时间较紧或难以实施完整方案 现状是什么，问题在哪里，怎么改 调研设计 → 现状诊断 → 问题归因 → 改进建议 → 可行性评估 调研数据、专家访谈、管理诊断表" [ref=e669]:
