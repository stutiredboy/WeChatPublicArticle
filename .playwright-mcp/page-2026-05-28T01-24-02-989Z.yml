          - cell "调研数据、专家访谈、管理诊断表" [ref=e674]
    - paragraph [ref=e675]:
      - strong [ref=e676]: 最稳妥选择：
      - text: 非全日制学生如果能拿到企业内部数据，优先考虑“专题研究类”或“案例研究类”。它们最容易形成“问题-分析-方案-验证”的闭环。
    - paragraph [ref=e677]:
      - strong [ref=e678]: 特别提醒：
      - text: 如果你选择“工程管理设计类”或“工程管理案例研究类”，提前问清学院是否要求成果评鉴、企业证明、专家意见或附录材料。评鉴材料通常需要写明评鉴主体、专家信息、评鉴过程和结论，临近盲审再补会很被动。
