    - paragraph [ref=e1769]:
      - strong [ref=e1770]: 可复现三件套：
    - list [ref=e1771]:
      - listitem [ref=e1772]:
        - strong [ref=e1773]: 原始数据只读保存。
        - text: 新建
        - code [ref=e1774]: raw/
        - text: 文件夹，原始导出文件不直接修改。
      - listitem [ref=e1775]:
        - strong [ref=e1776]: 清洗日志持续记录。
        - text: 例如“删除 3 条成本为负的记录”“将金额单位从元统一为万元”。
      - listitem [ref=e1777]:
        - strong [ref=e1778]: 数据字典单独维护。
        - text: 字段名、含义、单位、来源、缺失比例、处理方式都写清楚。
