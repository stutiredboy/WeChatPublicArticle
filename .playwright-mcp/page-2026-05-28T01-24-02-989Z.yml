    - paragraph [ref=e1608]:
      - strong [ref=e1609]: 样本量与方法的匹配关系：
      - text: "- 描述性统计、信效度检验：50-100 份即可 - 相关分析、T 检验、方差分析：建议 ≥ 100 份 - 回归分析：建议 ≥ 150 份（经验法则：样本量 ≥ 自变量数 × 15-20） - 如果你的问卷只能回收 50-80 份（如企业内部小范围调查），不要硬做回归，改用描述性统计 + 均值排序 + 访谈补充，同样可以形成有说服力的分析"
