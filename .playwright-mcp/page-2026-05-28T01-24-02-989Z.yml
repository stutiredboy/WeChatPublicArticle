          - cell "需求分析 → 设计依据 → 方案设计 → 实施/评鉴 → 优化" [ref=e661]
          - cell "设计图、指标体系、专家评审、试运行数据" [ref=e662]
        - row "工程管理案例研究类 你掌握一个成功或失败的真实项目案例 这个案例说明了什么规律，给同类项目什么启示 案例背景 → 问题/事件 → 数据分析 → 规律提炼 → 建议 项目文档、访谈、会议纪要、过程数据" [ref=e663]:
          - cell "工程管理案例研究类" [ref=e664]
          - cell "你掌握一个成功或失败的真实项目案例" [ref=e665]
          - cell "这个案例说明了什么规律，给同类项目什么启示" [ref=e666]
