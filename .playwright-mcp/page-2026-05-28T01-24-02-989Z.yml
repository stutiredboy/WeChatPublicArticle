    - heading "8.2 \"理论选择\"的核心原则" [level=3] [ref=e1834]
    - list [ref=e1835]:
      - listitem [ref=e1836]:
        - strong [ref=e1837]: 先选问题，再选理论
        - text: ：不是"我想用 AHP"，而是"我需要评价供应商，AHP 适合做这件事"
      - listitem [ref=e1838]:
        - strong [ref=e1839]: 不超过 2-3 个核心理论
        - text: ：贪多嚼不烂，每个理论都要在正文中实际用到
      - listitem [ref=e1840]:
        - strong [ref=e1841]: 用成熟理论，不追新
        - text: ：MEM 论文的创新不是"发明新理论"，而是"把成熟理论用在新场景"
      - listitem [ref=e1842]:
        - strong [ref=e1843]: 理论和方法要形成闭环
        - text: ：理论用来分析问题 → 方法用来建模/计算 → 数据用来验证
