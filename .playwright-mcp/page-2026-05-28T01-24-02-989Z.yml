    - paragraph [ref=e1515]: 取数前先做变量清单，不要把系统里的数据一股脑导出来。至少写清楚：因变量（你要解释或优化的结果指标）、自变量（可能影响结果的因素）、控制变量（需要排除干扰的条件）、数据粒度（每条记录是一张订单、一个项目、一次故障，还是一天的统计值）、时间范围（是否覆盖旺季淡季或完整项目周期）。
    - heading "7.2 问卷设计的\"傻瓜式\"流程" [level=3] [ref=e1516]
    - paragraph [ref=e1517]:
      - strong [ref=e1518]: "Step 1: 确定问卷的目标"
    - paragraph [ref=e1519]:
      - text: 你的问卷要回答什么问题？只有两种： -
      - strong [ref=e1520]: 识别型
      - text: ："影响 XX 的关键因素有哪些？各因素影响程度如何？" -
      - strong [ref=e1521]: 评价型
      - text: ："XX 的现状水平如何？各维度得分如何？"
    - paragraph [ref=e1522]:
      - strong [ref=e1523]: "Step 2: 确定量表结构"
    - paragraph [ref=e1524]:
      - text: 使用
      - strong [ref=e1525]: 李克特 5 级量表
      - text: （1=非常不同意，2=不同意，3=一般，4=同意，5=非常同意）。
    - paragraph [ref=e1526]: 问卷结构模板：
    - code [ref=e1529]: "Part 1: 基本信息（5-8 题） - 年龄、性别、学历、工作年限、所属部门、职位层级等 Part 2: 第一个维度（4-6 题） 例：进度管理因素 Q1: 项目进度计划制定合理且可执行 [1] [2] [3] [4] [5] Q2: 进度偏差能够被及时发现和纠正 [1] [2] [3] [4] [5] ... Part 3: 第二个维度（4-6 题） Part 4: 第三个维度（4-6 题） Part 5: 第四个维度（4-6 题）"
    - paragraph [ref=e1530]:
      - strong [ref=e1531]: "Step 3: 量表从哪来？"
    - paragraph [ref=e1532]:
      - strong [ref=e1533]: 不要完全凭空编问卷题目！
      - text: 正确做法： 1. 在知网搜索你的研究方向的硕博论文 2. 翻到论文附录，找到他们的问卷 3. 选取和你最相关的题目，根据你的研究情境做适当修改 4. 在论文中注明"本问卷参考了 XX(2023) 的量表，并根据 XX 行业特点进行了调整"
    - paragraph [ref=e1534]: 这样更合规，也更容易提高问卷的信效度。
    - paragraph [ref=e1535]:
      - strong [ref=e1536]: "Step 4: 预测试"
    - paragraph [ref=e1537]: 正式发放前，先找 20-30 人做预测试： - 填写时间是否在 5 分钟内？ - 有没有歧义的题目？ - 数据做一次信度检验，Cronbach's α < 0.7 的维度需要修改
    - paragraph [ref=e1538]:
      - strong [ref=e1539]: "Step 5: 正式发放与回收"
    - table [ref=e1540]:
      - rowgroup [ref=e1541]:
        - row "发放渠道 预期回收率 适用场景" [ref=e1542]:
