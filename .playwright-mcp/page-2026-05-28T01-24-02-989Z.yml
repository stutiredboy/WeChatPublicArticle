    - heading "3.1 选题自检流程（决策树）" [level=3] [ref=e470]
    - paragraph [ref=e471]: 按顺序回答以下问题：
    - code [ref=e474]: "Q1: 你目前工作中最头疼的管理问题是什么？ ├─ 能说出具体问题 → 进入 Q2 └─ 说不出来 → 执行\"痛点挖掘练习\"（见 3.2） Q2: 这个问题属于\"工程管理\"范畴吗？（进度/成本/质量/风险/供应链/组织协同） ├─ 是 → 进入 Q3 └─ 不确定 → 见 3.3 \"MEM 选题边界判断\" Q3: 你能拿到支撑这个问题的数据吗？（企业内部数据 / 可发问卷 / 公开行业数据） ├─ 能 → 进入 Q4 └─ 不能 → 换一个痛点，回到 Q1 Q4: 用一句话描述你的研究：\"针对 [企业/项目] 的 [具体问题]，运用 [理论/方法]， 提出 [优化方案]，并通过 [验证方式] 证明方案有效。\" ├─ 能写出来 → 恭喜，你有选题了！ └─ 写不出来 → 见 3.4 \"题目公式化生成\""
    - heading "3.2 痛点挖掘练习（如果你真的\"想不出来\"）" [level=3] [ref=e475]
