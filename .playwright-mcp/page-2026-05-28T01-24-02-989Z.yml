    - heading "3.7 先选论文类型，再选写法" [level=3] [ref=e640]
    - paragraph [ref=e641]: MEM 论文不是只有一种写法。按工程管理硕士论文标准，常见实践性论文可以分成以下几类。你要先判断自己属于哪一类，再决定章节结构和数据要求。
