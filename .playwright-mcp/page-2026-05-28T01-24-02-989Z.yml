    - paragraph [ref=e954]:
      - strong [ref=e955]: 综述写作的正确姿势：
    - code [ref=e958]: 不要写：张三研究了 A，李四研究了 B，王五研究了 C。 要写：现有研究主要从三个方向展开：第一类关注 A，代表研究包括……； 第二类关注 B，主要采用……方法；第三类关注 C，但在 [你的场景] 中仍存在…… 因此，本文拟……
