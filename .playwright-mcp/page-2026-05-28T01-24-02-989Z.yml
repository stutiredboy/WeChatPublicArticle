          - cell "换成自己岗位、企业、项目中能拿到材料的场景" [ref=e729]
        - row "学术支撑 能否找到相近文献、成熟理论或方法？ 不要只靠个人经验，先找 5 篇相似硕士论文和 10 篇期刊论文" [ref=e730]:
