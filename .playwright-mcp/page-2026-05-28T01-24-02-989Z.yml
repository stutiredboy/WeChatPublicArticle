    - paragraph [ref=e2314]:
      - strong [ref=e2315]: 再确认一件事：
      - text: 有些学校会要求提交 AI 使用声明，甚至限制生成式 AI 在论文写作中的使用范围。开写前先查学校最新规定；如果用了 AI 辅助翻译、润色或制图，保留原始材料、修改记录和人工核验过程。
    - paragraph [ref=e2316]:
      - strong [ref=e2317]: 盲审专家识别 AI 论文的常见特征：
      - text: 1. 文风过于流畅、缺少个人风格和专业术语的精准使用 2. 论述"正确但空洞"，缺乏具体数据和真实案例细节 3. 参考文献中混入不存在的论文（AI 编造的） 4. 开头千篇一律用"随着 XX 的快速发展……日益凸显"，没有落到具体行业和企业 5. 过渡衔接全靠"此外""然而""因此"等固定连接词，前后文缺少真正的逻辑铺垫 6. 遇到解释不清的地方就用"可能会产生一定影响""具体机制尚不清楚，需进一步研究"来回避
