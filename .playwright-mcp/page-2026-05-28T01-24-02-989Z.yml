    - paragraph [ref=e738]:
      - strong [ref=e739]: 选题自我预答辩三问：
    - list [ref=e740]:
      - listitem [ref=e741]:
        - strong [ref=e742]: 所以呢？
        - text: 这个问题不解决，会造成什么可量化后果？
      - listitem [ref=e743]:
        - strong [ref=e744]: 凭什么？
        - text: 你凭什么说它是问题，有没有基准、数据和文献？
      - listitem [ref=e745]:
        - strong [ref=e746]: 然后呢？
        - text: 你提出的方案能怎样回应问题，如何验证有效？
    - paragraph [ref=e747]: 如果这三问答不上来，题目暂时还只是一个工作抱怨，不是论文选题。
    - separator [ref=e748]
    - heading "第四章 文献综述——从\"完全看不懂\"到\"写出 8000 字\"" [level=2] [ref=e750]
    - paragraph [ref=e751]: 这是大多数非全日制学生最头疼的部分，因为你可能已经很多年没读过学术论文了。以下是一个完全从零开始的操作流程。
    - heading "4.1 文献查找：去哪找、搜什么、怎么筛" [level=3] [ref=e752]
    - paragraph [ref=e753]:
      - strong [ref=e754]: 第一步：确定搜索关键词（5 分钟）
    - paragraph [ref=e755]: 把你的题目拆成 3-4 个关键词组合。以"基于关键链法的 H 公司软件开发项目进度优化研究"为例：
    - list [ref=e756]:
      - listitem [ref=e757]: 关键词组 A：关键链法 / 关键链项目管理 / CCM / Critical Chain
      - listitem [ref=e758]: 关键词组 B：软件项目 / IT 项目 / 软件开发项目 / 敏捷项目
      - listitem [ref=e759]: 关键词组 C：进度管理 / 进度优化 / 工期控制 / Schedule Management
    - paragraph [ref=e760]: 检索时不要只输入一个大词。更稳的方式是“核心关键词 + 限定词”：
    - code [ref=e763]: 核心问题词：进度延误 / 成本超支 / 质量缺陷 / 风险评价 场景限定词：软件项目 / EPC 项目 / 数据中心 / 供应链 / 多式联运 方法限定词：关键链 / FMEA / AHP / 回归分析 / 价值流图 目标限定词：优化 / 评价 / 预警 / 协同 / 控制
    - paragraph [ref=e764]:
      - text: 在数据库高级检索里优先用“篇名/主题/关键词”字段，少用全文搜索；用
      - code [ref=e765]: AND
      - text: 缩小范围，用
      - code [ref=e766]: OR
      - text: 纳入同义词，用
      - code [ref=e767]: NOT
      - text: 排除明显无关领域。找到一篇高质量核心文献后，再做两件事：往回看它的参考文献，往前看它的被引文献，这比随机翻页效率高得多。
    - paragraph [ref=e768]:
      - strong [ref=e769]: 第二步：按优先级搜索以下平台
    - table [ref=e770]:
      - rowgroup [ref=e771]:
        - row "平台 搜索什么 数量目标" [ref=e772]:
          - columnheader "平台" [ref=e773]
          - columnheader "搜索什么" [ref=e774]
          - columnheader "数量目标" [ref=e775]
      - rowgroup [ref=e776]:
        - row "中国知网 CNKI（首选） 用关键词组 A+B 或 A+C 搜索硕博论文 找到 10-15 篇近 5 年的高质量硕博论文" [ref=e777]:
          - cell "中国知网 CNKI（首选）" [ref=e778]:
            - strong [ref=e779]: 中国知网 CNKI
            - text: （首选）
          - cell "用关键词组 A+B 或 A+C 搜索硕博论文" [ref=e780]
          - cell "找到 10-15 篇近 5 年的高质量硕博论文" [ref=e781]
        - row "知网期刊 同上关键词搜核心期刊论文 找到 15-20 篇近 5 年论文" [ref=e782]:
          - cell "知网期刊" [ref=e783]:
            - strong [ref=e784]: 知网期刊
          - cell "同上关键词搜核心期刊论文" [ref=e785]
          - cell "找到 15-20 篇近 5 年论文" [ref=e786]
        - row "万方/维普 补充知网没有的内容 补充 5-10 篇" [ref=e787]:
          - cell "万方/维普" [ref=e788]:
            - strong [ref=e789]: 万方/维普
          - cell "补充知网没有的内容" [ref=e790]
          - cell "补充 5-10 篇" [ref=e791]
        - row "Web of Science / Google Scholar 用英文关键词搜索 找到 5-10 篇英文文献（展示国际视野）" [ref=e792]:
          - cell "Web of Science / Google Scholar" [ref=e793]:
            - strong [ref=e794]: Web of Science / Google Scholar
          - cell "用英文关键词搜索" [ref=e795]
          - cell "找到 5-10 篇英文文献（展示国际视野）" [ref=e796]
    - paragraph [ref=e797]:
      - strong [ref=e798]: 第三步：快速筛选论文的技巧（每篇 3 分钟）
    - paragraph [ref=e799]:
      - text: 不需要一上来就通读。按这个顺序扫： 1.
      - strong [ref=e800]: 看题目
      - text: ：和你的方向相关吗？ 2.
      - strong [ref=e801]: 看摘要
      - text: ：他用了什么方法？解决了什么问题？ 3.
      - strong [ref=e802]: 看目录
      - text: ：论文结构是什么？有没有你可以参考的框架？ 4.
      - strong [ref=e803]: 看结论
      - text: ：他的发现是什么？有什么不足？ 5.
      - strong [ref=e804]: 标记
      - text: ：在文献管理工具（推荐 Zotero，免费）中标记为"精读"或"泛读"
    - heading "4.2 文献阅读：先精读 10 篇核心文献，再扩展到 50 篇左右" [level=3] [ref=e805]
    - paragraph [ref=e806]:
      - text: 从筛选出的文献中，先选出
      - strong [ref=e807]: 10 篇和你最相关的
      - text: 进行精读，用它们搭起目录、变量、方法和研究缺口的骨架。注意：这不是说最终只读 10 篇。终稿参考文献数量要以学校要求为准；如果学校没有明确要求，50-60 篇是较稳妥的目标，其中近 5 年文献和高质量期刊文献要占足够比例。
    - paragraph [ref=e808]: 精读时填写以下表格：
    - table [ref=e809]:
      - rowgroup [ref=e810]:
        - row "序号 作者/年份 研究对象 研究方法 核心发现 不足之处（你能补什么）" [ref=e811]:
