    - paragraph [ref=e708]: 当题目收窄到最后一层，你的论文目录、数据、方法基本就能跟着长出来。
    - heading "3.9 “现象”不是“问题”：选题前先过三道门" [level=3] [ref=e709]
    - paragraph [ref=e710]:
      - text: 网友经验里最值得吸收的一点是：
      - strong [ref=e711]: 不要把现象当问题。
      - text: “成本高、效率低、协同差、质量不稳定”都只是现象。合格的 MEM 论文问题，至少要同时说清楚边界、偏差、原因线索和管理改进空间。
    - paragraph [ref=e712]:
      - strong [ref=e713]: 把现象翻译成研究问题，可以套这个句式：
    - code [ref=e716]: 在 [企业/项目/流程] 的 [时间范围/业务范围] 内， [指标] 相比 [目标值/历史均值/行业基准/内部对标对象] 偏离 [数值或比例]， 该偏差主要集中在 [线路/部门/阶段/产品/人群]， 初步原因可能是 [可被管理手段干预的机制]， 因此拟运用 [理论/方法/工具] 对 [管理机制/流程/资源配置/决策规则] 进行优化。
    - paragraph [ref=e717]:
      - strong [ref=e718]: 三道门：
    - table [ref=e719]:
