    - heading "2.5 第一次联系导师的话术模板" [level=3] [ref=e461]
    - paragraph [ref=e462]: 不要发“老师您好，我想请您指导论文，可以吗？”这种空消息。你要让导师一眼看出你做过准备。
    - code [ref=e465]: 老师您好，我是 [年级/专业/姓名]，目前在 [公司/行业/岗位] 工作。 我初步想围绕 [具体工程场景] 中的 [具体管理问题] 做 MEM 论文。 目前有 3 个备选方向： 1. [题目1]：可用数据是 [数据]，可能方法是 [方法] 2. [题目2]：可用数据是 [数据]，可能方法是 [方法] 3. [题目3]：可用数据是 [数据]，可能方法是 [方法] 我比较担心 [最大不确定性]，想请老师帮忙判断哪个方向更适合作为毕业论文。 如果方便，我想约您 [两个可选时间] 沟通 20 分钟。我会提前把一页纸选题卡发给您。 谢谢老师。
    - paragraph [ref=e466]: 导师看重的不是你已经多厉害，而是你是否主动、具体、可推进。
