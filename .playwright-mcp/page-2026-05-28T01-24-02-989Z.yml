    - heading "7.7 访谈提纲模板" [level=3] [ref=e1709]
    - paragraph [ref=e1710]: 访谈适合用来解释“为什么”。建议每类角色访谈 3-5 人，总计 8-12 人即可形成较扎实的定性材料。
    - code [ref=e1713]: 访谈对象：项目经理 / 一线工程师 / 业务方 / 供应商 / 管理者 访谈时长：30-45 分钟 访谈方式：面对面 / 腾讯会议 / 电话 1. 您在该项目/流程中承担什么角色？ 2. 您认为当前 [管理问题] 最突出的表现是什么？能否举一个具体例子？ 3. 这个问题通常在什么环节发生？发生频率大概如何？ 4. 您认为主要原因是什么？制度、人员、工具、外部环境中哪个更关键？ 5. 现有管理流程中哪些地方最影响效率或质量？ 6. 如果要改进，您认为最可行的措施是什么？ 7. 对本文拟提出的 [方案方向]，您认为可行性和阻力分别是什么？ 8. 是否还有您认为重要但前面没问到的问题？
    - paragraph [ref=e1714]: 访谈写入论文时，不要大段贴原话。正确写法是“观点归纳表 + 典型短句 + 你的分析”。
    - heading "7.8 数据清洗与可复现：不要在原始文件上动刀" [level=3] [ref=e1715]
    - paragraph [ref=e1716]: 网友经验里“数据清洗很耗时”这一点非常真实，但要把它写成论文能力，而不是只在背后默默加班。你需要让导师和评委相信：你的数据从哪里来、怎么清洗、为什么可信、别人能否复核。
    - paragraph [ref=e1717]:
      - strong [ref=e1718]: 数据清洗四步法：
    - table [ref=e1719]:
