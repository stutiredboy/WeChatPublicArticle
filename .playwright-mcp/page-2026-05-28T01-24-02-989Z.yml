    - paragraph [ref=e1674]:
      - strong [ref=e1675]: 数据使用三原则：
      - text: 1. 能用真实数据就不用编造案例；真实数据不完整，也比完整但虚假的数据强。 2. 涉密数据先脱敏再写入论文；公司名、人名、金额、客户信息、系统架构都要谨慎。 3. 每张图表都要能追溯到原始数据文件，否则后期答辩很难解释。
    - heading "7.6 问卷质量控制：不要让问卷成为扣分点" [level=3] [ref=e1676]
    - paragraph [ref=e1677]: 问卷不是“发出去越多越好”。低质量问卷会直接伤害论文可信度。
