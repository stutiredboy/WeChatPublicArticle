    - paragraph [ref=e1742]:
      - strong [ref=e1743]: 注意：
      - text: “缺失值低于 5% 可删除、5%-20% 可插补、超过 20% 要谨慎”只是常见经验口径，不是通用规定。真正要看缺失机制、样本量、变量重要性和导师认可程度；不能为了让数据好看而机械删除或填补。
