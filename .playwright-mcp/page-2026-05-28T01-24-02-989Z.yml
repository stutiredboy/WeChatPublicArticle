          - columnheader "不足之处（你能补什么）" [ref=e817]
      - rowgroup [ref=e818]:
        - row "1 张三(2024) 某建筑项目进度 关键路径法+EVM 发现变更是延误主因 没考虑供应链因素" [ref=e819]:
          - cell "1" [ref=e820]
