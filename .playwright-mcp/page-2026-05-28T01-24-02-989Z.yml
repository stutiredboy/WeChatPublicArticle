    - paragraph [ref=e2291]: 不要把“熬夜等灵感”当成默认策略。非全日制论文靠的是稳定交付，不是偶尔爆发。偶尔赶节点可以理解，但长期熬夜会直接拖垮工作、论文和心态。更可靠的做法是每周固定 2-3 个时间块，每次只推进一个可交付物。
