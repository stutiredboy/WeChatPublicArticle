  - main [ref=e59]:
    - heading "非全日制 MEM 工程管理硕士毕业论文实战指南" [level=1] [ref=e60]
    - blockquote [ref=e61]:
      - paragraph [ref=e62]:
        - text: 本指南面向一个具体的人：你是非全日制 MEM 在读生，白天上班，晚上带着焦虑打开电脑，不知道论文该怎么开始。这份文档的目标是让你
        - strong [ref=e63]: 每一步都知道做什么、怎么做、做到什么程度算合格
        - text: 。
    - separator [ref=e64]
    - heading "第零章 在一切开始之前——给迷茫的你" [level=2] [ref=e65]
    - heading "0.1 你的焦虑是正常的，但可以被结构化" [level=3] [ref=e66]
    - paragraph [ref=e67]: 你现在的状态大概率是这样的：
    - list [ref=e68]:
      - listitem [ref=e69]: 不知道自己能写什么
      - listitem [ref=e70]: 觉得同学们都已经开始了，只有自己还在原地
      - listitem [ref=e71]: 打开知网看了几篇论文，完全看不懂在说什么
      - listitem [ref=e72]: 害怕选了一个太难的题目，更害怕选了一个太水的题目
    - paragraph [ref=e73]:
      - strong [ref=e74]: 这些都是正常的。
      - text: 很多非全日制 MEM 学生在开题前都会经历这个阶段。焦虑的本质不是"你不行"，而是"你不知道全貌"。当你看完这份指南，你会发现整个论文就是一个项目管理题——而你恰好在学项目管理。
    - heading "0.2 MEM 论文到底是什么？一句话讲清楚" [level=3] [ref=e75]
    - paragraph [ref=e76]:
      - strong [ref=e77]: MEM 论文 = 用学过的管理理论和工具，解决你工作中一个真实的工程管理问题，并用数据、调研或评鉴证明你的方案有效。
    - paragraph [ref=e78]:
      - text: 它不是： - 学术发现（不需要你提出新理论） - 工作总结（不能只有"我做了什么"，还要有"为什么这么做"和"效果如何"） - 技术报告（重点不是技术本身，而是
      - strong [ref=e79]: 管理
      - text: 技术实施的过程）
    - heading "0.3 给自己做一次\"资源盘点\"" [level=3] [ref=e80]
    - paragraph [ref=e81]: 在选题之前，先用 30 分钟填写下面这张表。它决定了你后续所有的选择：
