    - 'heading "Step 2: 选题" [level=3] [ref=e2108]'
    - paragraph [ref=e2109]: 从三个痛点中选"变更导致的故障"——数据最多、最具体、有明确的优化空间。
    - paragraph [ref=e2110]:
      - strong [ref=e2111]: 题目：基于 FMEA 的 M 互联网公司 IT 变更风险管理优化研究
    - 'heading "Step 3: 论文框架" [level=3] [ref=e2112]'
    - code [ref=e2115]: 第 1 章 绪论 第 2 章 相关理论基础 2.1 IT 变更管理（ITIL 框架） 2.2 FMEA（失效模式与影响分析） 2.3 风险矩阵理论 第 3 章 M 公司 IT 变更管理现状与问题 3.1 公司概况与 IT 运维组织架构 3.2 现有变更管理流程分析（配流程图） 3.3 变更故障数据统计分析（3年数据、帕累托图） 3.4 存在的主要问题 第 4 章 变更风险成因分析 4.1 基于鱼骨图的成因梳理 4.2 基于问卷调查的成因验证（面向 50 名运维同事） 4.3 关键风险因素识别 第 5 章 基于 FMEA 的变更风险管理优化方案 5.1 变更风险 FMEA 分析模型构建 5.2 变更风险等级评估标准设计 5.3 分级管控策略设计（高/中/低风险变更的不同审批流程） 5.4 变更风险管理制度与保障措施 第 6 章 方案实施与效果验证 6.1 试点实施方案（选取 1 个业务线试运行 2 个月） 6.2 实施前后故障率数据对比 6.3 FMEA 评分改善情况 第 7 章 结论与展望
    - 'heading "Step 4: 关键数据产出" [level=3] [ref=e2116]'
    - list [ref=e2117]:
      - listitem [ref=e2118]:
        - strong [ref=e2119]: 第 3 章
        - text: ：3 年故障工单统计 → 帕累托图显示"变更引发的故障占 42%"
      - listitem [ref=e2120]:
        - strong [ref=e2121]: 第 4 章
        - text: ：鱼骨图 + 50 份内部问卷 → 描述性统计 + 均值排序识别出 TOP 5 风险因素（注意：50 份样本适合做描述性统计和简单排序，不足以支撑复杂回归模型。如果需要回归分析，样本量建议 ≥ 100）
      - listitem [ref=e2122]:
        - strong [ref=e2123]: 第 5 章
        - text: ：FMEA 评分矩阵（风险优先数 RPN = 严重度 × 发生度 × 检测度）
      - listitem [ref=e2124]:
        - strong [ref=e2125]: 第 6 章
        - text: ：试点 2 个月后，变更故障率从 42% 降至 18%
    - paragraph [ref=e2126]:
      - strong [ref=e2127]: 这就是一篇完整的、可以通过盲审的 MEM 论文。
      - text: 它没有用高深的算法，没有复杂的数学模型，但它有真实的问题、真实的数据、成熟的方法、可验证的结果。
    - separator [ref=e2128]
    - heading "第十四章 同学常见问题 FAQ" [level=2] [ref=e2130]
    - 'heading "Q1: 导师不回消息怎么办？" [level=3] [ref=e2131]'
    - paragraph [ref=e2132]: 先确认沟通方式（有些导师只看邮件，不看微信）。每次发消息时带上你的具体问题和你的思考（"老师，我在 XX 方面遇到困难，我目前的想法是 XX，请问这样可以吗？"），而不是"老师，我该怎么办？"。如果持续一周无回复，可以尝试：①发邮件 ②通过师兄师姐转达 ③在组会上当面沟通。
    - 'heading "Q2: 企业数据涉密怎么处理？" [level=3] [ref=e2133]'
    - paragraph [ref=e2134]:
      - text: 三种策略： 1.
      - strong [ref=e2135]: 脱敏处理
      - text: ：将公司名改为"M 公司"、具体金额改为区间或指数化数据；如果确需按比例缩放，必须保持相对关系一致，并在论文中说明处理方式 2.
      - strong [ref=e2136]: 签署知情同意
      - text: ：和领导/法务确认可以使用的数据范围 3.
      - strong [ref=e2137]: 降级使用
      - text: ：如果核心数据实在不能用，改用"问卷 + 访谈"收集定性定量数据
    - 'heading "Q3: 时间只剩 6 个月了，来得及吗？" [level=3] [ref=e2138]'
    - paragraph [ref=e2139]: 来得及，但需要压缩。建议： - 选"案例研究型"论文（数据好拿、不需要大量问卷） - 选你最熟悉的工作场景（不需要额外调研） - 导师沟通频率从 2 周一次改为每周一次 - 每天稳定推进 300-500 字或 1 个小任务。不要把目标理解成凑字数，真正重要的是每周都有可交付版本。
    - 'heading "Q4: 我的行业太小众，找不到参考文献怎么办？" [level=3] [ref=e2140]'
    - list [ref=e2141]:
      - listitem [ref=e2142]: 扩大搜索范围：如果你是做"宠物医院管理"的，搜索"医疗服务机构管理""连锁门店运营管理"
      - listitem [ref=e2143]: 跨行业借鉴：你面临的管理问题（进度、成本、质量、风险）是通用的，文献不限于你的行业
      - listitem [ref=e2144]: 英文文献搜索：小众行业在国外可能有大量研究
    - 'heading "Q5: 感觉自己一个人在战斗，怎么找到同伴？" [level=3] [ref=e2145]'
    - paragraph [ref=e2146]:
      - text: 非全日制学生最大的劣势不是能力，是孤立。你需要主动建立支持网络： 1.
      - strong [ref=e2147]: 同门/同导师群
      - text: ：找到和你同一届、同一导师的同学，分享进度、互相督促、交换文献 2.
      - strong [ref=e2148]: 往届师兄师姐
      - text: ：他们的论文就是你最好的参考模板，问他们导师的偏好、盲审的尺度、答辩的流程 3.
      - strong [ref=e2149]: MEM 同学论文互助群
      - text: ：很多学校的 MEM 班级群里会自然形成"论文互助小组"，如果没有可以主动发起 4.
      - strong [ref=e2150]: 论文写作打卡
      - text: ：找 2-3 个同进度的同学，每周互相汇报进度，比一个人死撑有效得多
    - 'heading "Q6: 导师的修改意见和我的想法不一致怎么办？" [level=3] [ref=e2151]'
    - paragraph [ref=e2152]:
      - text: 先区分两种情况： 1.
      - strong [ref=e2153]: 学术规范层面的意见
      - text: （如"文献综述要按主题归类""需要补信效度检验""方法选择要有文献依据"）：这类意见几乎一定要听。导师比你更了解盲审评委会关注什么。 2.
      - strong [ref=e2154]: 实践判断层面的分歧
      - text: （如"这个方案在企业里不可行""行业实际情况不是这样的"）：这类你可以和导师讨论，但方式很重要——带着数据和事实去沟通（"老师，我在企业的实际观察是 XX，数据显示 XX，所以我倾向于 XX 的处理方式，您觉得这样在学术上是否站得住？"），而不是"我觉得不对"。
    - paragraph [ref=e2155]:
      - strong [ref=e2156]: 底线原则：
      - text: 导师签字才能送审。即使你有保留意见，在学术规范问题上和导师对齐是第一优先级。实践层面的分歧，大多可以在"研究不足"中体现，不需要硬刚。
    - 'heading "Q7: 被盲审打回（低于 70 分）还能救吗？" [level=3] [ref=e2157]'
    - paragraph [ref=e2158]:
      - text: 能救，但几乎等于重写。按优先级处理： 1.
      - strong [ref=e2159]: 先救选题
      - text: ：如果选题被否，必须换题 2.
      - strong [ref=e2160]: 再救逻辑
      - text: ：确保"问题→成因→方案→验证"一条线贯穿到底 3.
      - strong [ref=e2161]: 补数据
      - text: ：加入缺失的实证数据和分析 4.
      - strong [ref=e2162]: 改文字
      - text: ：去掉"工作总结"式表述，加入学术引用和规范表述 5.
      - strong [ref=e2163]: 磨格式
      - text: ：按学校模板逐项检查
