      - text: ，这会让语句不通顺 - 正确做法：
      - strong [ref=e1862]: 理解原文意思后用自己的话重新组织
      - text: "- 引用他人观点时，用\"XX(2023)指出……\"并加角标；规范引用不能替代原创分析，也不要大段照搬 - 公式、表格、自己的分析内容不会重复，多产出原创分析是最有效的降重"
