    - separator [ref=e672]
    - heading "第四章 文献综述——从\"完全看不懂\"到\"写出 8000 字\"" [level=2] [ref=e674]
    - paragraph [ref=e675]: 这是大多数非全日制学生最头疼的部分，因为你可能已经很多年没读过学术论文了。以下是一个完全从零开始的操作流程。
    - heading "4.1 文献查找：去哪找、搜什么、怎么筛" [level=3] [ref=e676]
    - paragraph [ref=e677]:
      - strong [ref=e678]: 第一步：确定搜索关键词（5 分钟）
    - paragraph [ref=e679]: 把你的题目拆成 3-4 个关键词组合。以"基于关键链法的 H 公司软件开发项目进度优化研究"为例：
    - list [ref=e680]:
      - listitem [ref=e681]: 关键词组 A：关键链法 / 关键链项目管理 / CCM / Critical Chain
      - listitem [ref=e682]: 关键词组 B：软件项目 / IT 项目 / 软件开发项目 / 敏捷项目
      - listitem [ref=e683]: 关键词组 C：进度管理 / 进度优化 / 工期控制 / Schedule Management
    - paragraph [ref=e684]:
      - strong [ref=e685]: 第二步：按优先级搜索以下平台
    - table [ref=e686]:
      - rowgroup [ref=e687]:
        - row "平台 搜索什么 数量目标" [ref=e688]:
          - columnheader "平台" [ref=e689]
          - columnheader "搜索什么" [ref=e690]
          - columnheader "数量目标" [ref=e691]
      - rowgroup [ref=e692]:
        - row "中国知网 CNKI（首选） 用关键词组 A+B 或 A+C 搜索硕博论文 找到 10-15 篇近 5 年的高质量硕博论文" [ref=e693]:
          - cell "中国知网 CNKI（首选）" [ref=e694]:
            - strong [ref=e695]: 中国知网 CNKI
            - text: （首选）
          - cell "用关键词组 A+B 或 A+C 搜索硕博论文" [ref=e696]
          - cell "找到 10-15 篇近 5 年的高质量硕博论文" [ref=e697]
        - row "知网期刊 同上关键词搜核心期刊论文 找到 15-20 篇近 5 年论文" [ref=e698]:
          - cell "知网期刊" [ref=e699]:
            - strong [ref=e700]: 知网期刊
          - cell "同上关键词搜核心期刊论文" [ref=e701]
          - cell "找到 15-20 篇近 5 年论文" [ref=e702]
        - row "万方/维普 补充知网没有的内容 补充 5-10 篇" [ref=e703]:
          - cell "万方/维普" [ref=e704]:
            - strong [ref=e705]: 万方/维普
          - cell "补充知网没有的内容" [ref=e706]
          - cell "补充 5-10 篇" [ref=e707]
        - row "Web of Science / Google Scholar 用英文关键词搜索 找到 5-10 篇英文文献（展示国际视野）" [ref=e708]:
          - cell "Web of Science / Google Scholar" [ref=e709]:
            - strong [ref=e710]: Web of Science / Google Scholar
          - cell "用英文关键词搜索" [ref=e711]
          - cell "找到 5-10 篇英文文献（展示国际视野）" [ref=e712]
    - paragraph [ref=e713]:
      - strong [ref=e714]: 第三步：快速筛选论文的技巧（每篇 3 分钟）
    - paragraph [ref=e715]:
      - text: 不需要一上来就通读。按这个顺序扫： 1.
      - strong [ref=e716]: 看题目
      - text: ：和你的方向相关吗？ 2.
      - strong [ref=e717]: 看摘要
      - text: ：他用了什么方法？解决了什么问题？ 3.
      - strong [ref=e718]: 看目录
      - text: ：论文结构是什么？有没有你可以参考的框架？ 4.
      - strong [ref=e719]: 看结论
      - text: ：他的发现是什么？有什么不足？ 5.
      - strong [ref=e720]: 标记
      - text: ：在文献管理工具（推荐 Zotero，免费）中标记为"精读"或"泛读"
    - heading "4.2 文献阅读：精读 10 篇就够" [level=3] [ref=e721]
    - paragraph [ref=e722]:
      - text: 从筛选出的文献中，选出
      - strong [ref=e723]: 10 篇和你最相关的
      - text: 进行精读。精读时填写以下表格：
