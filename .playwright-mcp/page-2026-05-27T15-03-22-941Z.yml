    - paragraph [ref=e167]:
      - strong [ref=e168]: 今天结束时，你只需要拿到一个最低可用版本：
    - code [ref=e171]: 我目前在 [行业/岗位]，能接触到 [项目/系统/流程]。 我观察到的核心管理问题是 [具体痛点]，它造成了 [可量化后果]。 我初步想用 [理论/方法] 分析原因并提出 [优化方向]。 我能获取的数据包括 [数据1]、[数据2]、[访谈/问卷对象]。 我担心的问题是 [数据权限/方法不会/题目太大]，希望导师帮我判断是否可行。
    - heading "0.5 论文不是“写文章”，而是交付一个管理改进证据链" [level=3] [ref=e172]
    - paragraph [ref=e173]: 从第一天开始，你就要把论文理解成一条证据链：
    - code [ref=e176]: 真实工程场景 → 具体管理问题 → 数据证明问题存在 → 理论/方法解释问题成因 → 方案逐项回应成因 → 数据或专家评审证明方案有效 → 形成可复用的管理启示
    - paragraph [ref=e177]: 后面所有章节都服务于这条链。只要某一段内容不能回答“它在证据链里承担什么作用”，就要删掉或重写。
