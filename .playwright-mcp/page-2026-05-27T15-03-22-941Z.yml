    - paragraph [ref=e1469]:
      - strong [ref=e1470]: 数据使用三原则：
      - text: 1. 能用真实数据就不用编造案例；真实数据不完整，也比完整但虚假的数据强。 2. 涉密数据先脱敏再写入论文；公司名、人名、金额、客户信息、系统架构都要谨慎。 3. 每张图表都要能追溯到原始数据文件，否则后期答辩很难解释。
