    - heading "4.3 文献综述的写作结构（可直接套用的模板）" [level=3] [ref=e751]
    - paragraph [ref=e752]:
      - text: 文献综述不是罗列"张三说了什么、李四说了什么"，而是要按
      - strong [ref=e753]: 主题
      - text: 组织，形成
      - strong [ref=e754]: 有观点的叙述
      - text: ：
    - code [ref=e757]: 2.1 [核心理论] 的研究现状 2.1.1 [理论]的起源与发展（3-5 段，讲清楚这个理论是什么、核心要素有哪些） 2.1.2 [理论]在工程管理中的应用（综述别人怎么用的，按时间线或应用场景分） 2.2 [你的研究主题] 的研究现状 2.2.1 国外研究综述（按主题归类，不是按作者罗列） 2.2.2 国内研究综述（同上） 2.3 文献评述与研究缺口（最关键的一节，500-800字） - 现有研究取得了哪些成果？（肯定前人） - 现有研究存在哪些不足？（指出缺口） - 本研究如何弥补这些不足？（亮出你的价值）
