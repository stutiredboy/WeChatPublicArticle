    - heading "8.2 \"理论选择\"的核心原则" [level=3] [ref=e1564]
    - list [ref=e1565]:
      - listitem [ref=e1566]:
        - strong [ref=e1567]: 先选问题，再选理论
        - text: ：不是"我想用 AHP"，而是"我需要评价供应商，AHP 适合做这件事"
      - listitem [ref=e1568]:
        - strong [ref=e1569]: 不超过 2-3 个核心理论
        - text: ：贪多嚼不烂，每个理论都要在正文中实际用到
      - listitem [ref=e1570]:
        - strong [ref=e1571]: 用成熟理论，不追新
        - text: ：MEM 论文的创新不是"发明新理论"，而是"把成熟理论用在新场景"
      - listitem [ref=e1572]:
        - strong [ref=e1573]: 理论和方法要形成闭环
        - text: ：理论用来分析问题 → 方法用来建模/计算 → 数据用来验证
