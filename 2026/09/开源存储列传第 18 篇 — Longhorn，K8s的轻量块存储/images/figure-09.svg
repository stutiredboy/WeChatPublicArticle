<svg style="width:100%;height:auto;display:block;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;" viewbox="0 0 700 280"><text fill="#16213e" font-size="14" font-weight="bold" text-anchor="middle" x="350" y="22"><tspan leaf="">v1 与 v2 数据路径对比</tspan></text><rect fill="#667eea" height="30" rx="4" width="300" x="30" y="48"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="180" y="68"><tspan leaf="">v1 引擎（内核态路径）</tspan></text><rect fill="#f8f9fa" height="150" rx="4" stroke="#dee2e6" width="300" x="30" y="78"></rect><text fill="#333" font-size="11" x="45" y="104"><tspan leaf="">应用 → 内核块层</tspan></text><text fill="#333" font-size="11" x="45" y="126"><tspan leaf="">→ 内核网络栈收发</tspan></text><text fill="#333" font-size="11" x="45" y="148"><tspan leaf="">→ 中断、上下文切换</tspan></text><text fill="#333" font-size="11" x="45" y="170"><tspan leaf="">→ 副本进程落盘</tspan></text><text fill="#e94560" font-size="11" x="45" y="198"><tspan leaf="">高 IOPS 下 CPU 开销大</tspan></text><rect fill="#27ae60" height="30" rx="4" width="300" x="370" y="48"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="520" y="68"><tspan leaf="">v2 引擎（SPDK 用户态）</tspan></text><rect fill="#f8f9fa" height="150" rx="4" stroke="#dee2e6" width="300" x="370" y="78"></rect><text fill="#333" font-size="11" x="385" y="104"><tspan leaf="">应用 → NVMe 设备（NVMe-oF）</tspan></text><text fill="#333" font-size="11" x="385" y="126"><tspan leaf="">→ 用户态 SPDK 驱动</tspan></text><text fill="#333" font-size="11" x="385" y="148"><tspan leaf="">→ 轮询，无中断开销</tspan></text><text fill="#333" font-size="11" x="385" y="170"><tspan leaf="">→ 直通 NVMe 盘落盘</tspan></text><text fill="#27ae60" font-size="11" x="385" y="198"><tspan leaf="">低延迟、高 IOPS、低 CPU 开销</tspan></text><text fill="#888" font-size="11" text-anchor="middle" x="350" y="258"><tspan leaf="">性能提升幅度为官方宣称，实际以自测为准</tspan></text></svg>