<svg style="width:100%;height:auto;display:block;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;" viewbox="0 0 700 260"><text fill="#16213e" font-size="14" font-weight="bold" text-anchor="middle" x="350" y="22"><tspan leaf="">三类块存储的分工</tspan></text><rect fill="#667eea" height="36" rx="4" width="210" x="20" y="48"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="125" y="71"><tspan leaf="">云盘</tspan></text><rect fill="#f8f9fa" height="120" rx="4" stroke="#dee2e6" width="210" x="20" y="84"></rect><text fill="#333" font-size="11" x="35" y="108"><tspan leaf="">公有云首选</tspan></text><text fill="#333" font-size="11" x="35" y="128"><tspan leaf="">快照复制云平台包办</tspan></text><text fill="#333" font-size="11" x="35" y="148"><tspan leaf="">不出云，多云不适用</tspan></text><text fill="#555" font-size="11" x="35" y="172"><tspan leaf="">关键词：省心、绑定</tspan></text><rect fill="#27ae60" height="36" rx="4" width="210" x="245" y="48"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="350" y="71"><tspan leaf="">Longhorn</tspan></text><rect fill="#f8f9fa" height="120" rx="4" stroke="#dee2e6" width="210" x="245" y="84"></rect><text fill="#333" font-size="11" x="260" y="108"><tspan leaf="">自建、边缘、多云</tspan></text><text fill="#333" font-size="11" x="260" y="128"><tspan leaf="">中小集群，装完即用</tspan></text><text fill="#333" font-size="11" x="260" y="148"><tspan leaf="">不养存储团队</tspan></text><text fill="#555" font-size="11" x="260" y="172"><tspan leaf="">关键词：轻量、够用</tspan></text><rect fill="#0f3460" height="36" rx="4" width="210" x="470" y="48"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="575" y="71"><tspan leaf="">Ceph RBD</tspan></text><rect fill="#f8f9fa" height="120" rx="4" stroke="#dee2e6" width="210" x="470" y="84"></rect><text fill="#333" font-size="11" x="485" y="108"><tspan leaf="">大规模统一存储池</tspan></text><text fill="#333" font-size="11" x="485" y="128"><tspan leaf="">PB 级，多形态输出</tspan></text><text fill="#333" font-size="11" x="485" y="148"><tspan leaf="">需要专门团队运维</tspan></text><text fill="#555" font-size="11" x="485" y="172"><tspan leaf="">关键词：规模、全功能</tspan></text><text fill="#888" font-size="11" text-anchor="middle" x="350" y="238"><tspan leaf="">三者不互斥，一个集群里可以混用多个 StorageClass</tspan></text></svg>